<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="XM BrowserStartPage —— 极简浏览器起始页：本地优先、零外部 API、零后端、零账号。" />
  <!-- 告知浏览器本页支持亮 / 暗两种配色，表单控件等自动适配 -->
  <meta name="color-scheme" content="light dark" />
  <!-- 移动端地址栏颜色跟随主题 -->
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
  <title>XM 起始页</title>

  <!--
    防首屏闪白：在 CSS 生效前同步解析主题并写入 <html data-theme>。
    必须为纯内联同步脚本，不可 import。
    注意：下方的 storage key 需与 src/storage/storage.js 中的 STORAGE_KEY 保持一致。
  -->
  <script>
    (function () {
      var mode = 'system'; // localStorage 不可用时降级为跟随系统
      try {
        var raw = localStorage.getItem('xm-startpage:config');
        if (raw) mode = JSON.parse(raw).theme || 'system';
      } catch (e) {
        /* 读取失败保持 system */
      }
      var dark =
        mode === 'dark' ||
        (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';

      // 语言：影响字体渲染和 placeholder 预置，head 里只写 documentElement.lang
      try {
        var lang = localStorage.getItem('xm-startpage:language') || 'zh-CN';
        if (lang === 'en-US' || lang === 'zh-CN') {
          document.documentElement.lang = lang;
        }
      } catch (e) {
        /* 读取失败保持默认 zh-CN */
      }
    })();
  </script>

  <link rel="icon" href="./public/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./src/styles/reset.css?v=20261005i" />
  <link rel="stylesheet" href="./src/styles/variables.css?v=20261005i" />
  <link rel="stylesheet" href="./src/styles/main.css?v=20261005i" />

  <!-- ES Modules 入口，默认 defer，无需放在 body 末尾 -->
  <script type="module" src="./src/main.js?v=20261005i"></script>
</head>
<body>
  <!-- 壁纸背景层与遮罩层（位于内容之下） -->
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="wallpaper-overlay" aria-hidden="true"></div>

  <!-- 主容器：全屏纵向布局 -->
  <div class="app" id="app">

    <!-- 顶栏：仅保留设置入口 -->
    <header class="app-header">
      <button class="settings-trigger" id="settings-trigger" type="button" aria-label="打开设置" title="设置">
        <!-- 内联 SVG 齿轮图标，避免引入外部图标库 -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- 主内容区：垂直水平居中 -->
    <main class="app-main">

      <!-- 时间 / 日期 / 问候语区域（占位，由 clock.js / greeting.js 填充） -->
      <section class="clock-region" aria-label="时间与问候">
        <time class="clock" id="clock">--:--</time>
        <p class="date" id="date"></p>
        <p class="greeting" id="greeting"></p>
      </section>

      <!-- 搜索区域 -->
      <section class="search-region" aria-label="搜索">
        <form class="search-form" id="search-form" role="search">
          <div class="search-box">
            <!-- 引擎切换按钮（预置默认引擎必应图标，JS 会替换） -->
            <button class="engine-toggle" id="engine-toggle" type="button"
                    aria-haspopup="listbox" aria-expanded="false"
                    aria-label="切换搜索引擎"><span class="engine-icon">b</span></button>
            <input class="search-input" id="search-input" type="text"
                   autocomplete="off" autocapitalize="off" spellcheck="false"
                   enterkeyhint="search"
                   placeholder="在 必应 中搜索" />
            <!-- 输入意图提示（N1：URL 访问 / 引擎搜索，悬于框内右侧，不占布局） -->
            <span class="search-hint" id="search-hint" hidden></span>
            <!-- 引擎下拉菜单 -->
            <div class="engine-menu" id="engine-menu" role="listbox" hidden></div>
          </div>
        </form>
      </section>

    </main>

  </div>

  <!-- 快速链接 Dock（macOS 风格托架，固定视口底部；由 quick-links.js 填充，无数据时隐藏） -->
  <section class="quicklinks-dock" id="quicklinks-dock" hidden></section>

  <!-- 拖拽壁纸遮罩（N3：dragover 时显示，提示松开设为壁纸） -->
  <div class="drop-overlay" id="drop-overlay" aria-hidden="true" hidden>
    <div class="drop-overlay-box">
      <p class="drop-overlay-text"></p>
    </div>
  </div>

  <!-- 设置遮罩层 -->
  <div class="settings-overlay" id="settings-overlay" aria-hidden="true" hidden></div>

  <!-- 设置抽屉（右侧滑出，由 settings.js 接管） -->
  <aside class="settings-panel" id="settings-panel" role="dialog" aria-modal="true"
         aria-labelledby="settings-title" hidden>
    <header class="settings-header">
      <h2 id="settings-title">设置</h2>
      <button class="settings-close" id="settings-close" type="button" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="settings-body" id="settings-body">
      <!-- 各分区由 settings.js 动态构建 -->
    </div>
  </aside>

  <!--
    预置首屏状态：在 ES Module 执行前（同步），把存储里的壁纸 / 语言相关初始值
    直接写进 DOM，避免 first-paint 到 JS 执行之间的占位符闪烁。
    注意：此脚本在 </body> 前同步执行，此时 body 里的元素已全部解析。
  -->
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('xm-startpage:config') || '{}');

        // 壁纸：预置类型和背景，避免壁纸层从空到有 / 从默认到实际的闪烁
        var wp = cfg.wallpaper || {};
        if (wp.type) {
          document.documentElement.dataset.wallpaperType = wp.type;
          var wpEl = document.getElementById('wallpaper');
          if (wpEl) {
            if (wp.type === 'solid' && wp.value) {
              wpEl.style.backgroundColor = wp.value;
            } else if (wp.type === 'gradient' && wp.value) {
              wpEl.style.backgroundImage = wp.value;
            }
            // 'local' 类型依赖 IndexedDB，无法预置，接受短暂默认背景
          }
        }

        // 语言：预置搜索框 placeholder 和设置标题
        var lang = 'zh-CN';
        try {
          lang = localStorage.getItem('xm-startpage:language') || 'zh-CN';
        } catch (e) { /* 保持默认 */ }

        var phMap = {
          'zh-CN': '在 必应 中搜索',
          'en-US': 'Search on Bing'
        };
        var titleMap = {
          'zh-CN': '设置',
          'en-US': 'Settings'
        };

        var si = document.getElementById('search-input');
        if (si) si.placeholder = phMap[lang] || phMap['zh-CN'];

        var st = document.getElementById('settings-title');
        if (st) st.textContent = titleMap[lang] || titleMap['zh-CN'];
      } catch (e) {
        // 全部失败时静默降级为 HTML 默认值
      }
    })();
  </script>

</body>
</html>
