<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="XM BrowserStartPage —— 极简浏览器起始页：本地优先、零外部 API、零后端、零账号。" />
  <!-- 告知浏览器本页支持亮 / 暗两种配色，表单控件等自动适配 -->
  <meta name="color-scheme" content="light dark" />
  <title>XM 起始页</title>

  <!--
    防首屏闪白：在 CSS 生效前同步解析主题并写入 <html data-theme>。
    必须为纯内联同步脚本，不可 import。
    注意：下方的 storage key 需与 src/storage/storage.js 中的 STORAGE_KEY 保持一致。
  -->
  <script>
    (function () {
      var mode = 'system'; // localStorage 不可用时降级为跟随系统
      try {
        var raw = localStorage.getItem('xm-startpage:config');
        if (raw) mode = JSON.parse(raw).theme || 'system';
      } catch (e) {
        /* 读取失败保持 system */
      }
      var dark =
        mode === 'dark' ||
        (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>

  <link rel="icon" href="./public/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./src/styles/reset.css?v=20261004g" />
  <link rel="stylesheet" href="./src/styles/variables.css?v=20261004g" />
  <link rel="stylesheet" href="./src/styles/main.css?v=20261004g" />

  <!-- ES Modules 入口，默认 defer，无需放在 body 末尾 -->
  <script type="module" src="./src/main.js?v=20261004g"></script>
</head>
<body>
  <!-- 壁纸背景层与遮罩层（位于内容之下） -->
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="wallpaper-overlay" aria-hidden="true"></div>

  <!-- 主容器：全屏纵向布局 -->
  <div class="app" id="app">

    <!-- 顶栏：仅保留设置入口 -->
    <header class="app-header">
      <button class="settings-trigger" id="settings-trigger" type="button" aria-label="打开设置" title="设置">
        <!-- 内联 SVG 齿轮图标，避免引入外部图标库 -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- 主内容区：垂直水平居中 -->
    <main class="app-main">

      <!-- 时间 / 日期 / 问候语区域（占位，由 clock.js / greeting.js 填充） -->
      <section class="clock-region" aria-label="时间与问候">
        <time class="clock" id="clock">--:--</time>
        <p class="date" id="date"></p>
        <p class="greeting" id="greeting"></p>
      </section>

      <!-- 搜索区域 -->
      <section class="search-region" aria-label="搜索">
        <form class="search-form" id="search-form" role="search">
          <div class="search-box">
            <!-- 引擎切换按钮 -->
            <button class="engine-toggle" id="engine-toggle" type="button"
                    aria-haspopup="listbox" aria-expanded="false"
                    aria-label="切换搜索引擎"></button>
            <input class="search-input" id="search-input" type="text"
                   autocomplete="off" autocapitalize="off" spellcheck="false"
                   placeholder="搜索…" />
            <!-- 引擎下拉菜单 -->
            <div class="engine-menu" id="engine-menu" role="listbox" hidden></div>
          </div>
        </form>
      </section>

    </main>

  </div>

  <!-- 设置遮罩层 -->
  <div class="settings-overlay" id="settings-overlay" aria-hidden="true" hidden></div>

  <!-- 设置抽屉（右侧滑出，由 settings.js 接管） -->
  <aside class="settings-panel" id="settings-panel" role="dialog" aria-modal="true"
         aria-labelledby="settings-title" hidden>
    <header class="settings-header">
      <h2 id="settings-title"></h2>
      <button class="settings-close" id="settings-close" type="button" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="settings-body" id="settings-body">
      <!-- 各分区由 settings.js 动态构建 -->
    </div>
  </aside>

</body>
</html>
